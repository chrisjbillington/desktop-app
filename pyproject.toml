[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages]
find = {namespaces = false}

[tool.setuptools_conda]
# Linux conda packages are built with the GCC version that Anaconda's default channels
# use, c_compiler_version in
# https://github.com/AnacondaRecipes/aggregate/blob/master/conda_build_config.yaml,
# so that they install from those channels. Raise this when that version is raised.
conda_build_config = {c_compiler_version = '14; sys_platform == "linux"', cxx_compiler_version = '14; sys_platform == "linux"'}

[project]
name = "desktop-app"
description = "OS menu shortcuts, correct taskbar behaviour, and environment activation for Python GUI apps"
authors = [
    {name = "Chris Billington", email = "chrisjbillington@gmail.com"}
]
keywords = [
    "desktop",
    "windows",
    "launchers",
    "taskbar",
    "start-menu",
]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = [
    "distlib",
    "pywin32; sys_platform == 'win32'",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/chrisjbillington/desktop-app"

[project.scripts]
desktop-app = "desktop_app.__main__:main"
